name: "Railo"
description: "Fixes the security findings in your pull requests as a reviewed fix PR. Deterministic rewrites, no LLM-written code; runs in your own runner."
author: "IWEB"

inputs:
  license_key:
    description: "Paid plans only. Without a key Railo runs on the Free tier. Pass via secrets.RAILO_LICENSE_KEY."
    required: false
    default: ""
  github_token:
    description: "GitHub token for API access. Uses the automatic GITHUB_TOKEN by default."
    required: false
    default: ${{ github.token }}
  mode:
    description: "'warn' comments the proposed fixes on the PR; 'enforce' opens a separate fix PR against the PR's branch. Neither commits to the contributor's branch."
    required: false
    default: "warn"
  base_branch:
    description: "Branch to diff against. Leave empty to use the pull request's base branch."
    required: false
    default: ""
  max_diff_lines:
    description: "Largest total diff Railo will deliver in one run (safety rail)."
    required: false
    default: "500"
  test_before_commit:
    description: "Run your tests before delivering fixes; a fix that adds a failure is dropped."
    required: false
    default: "false"
  test_command:
    description: "Command to run when test_before_commit is true (e.g. pytest, npm test)."
    required: false
    default: "pytest"
  sarif:
    description: "SARIF files from scanners you already run (CodeQL, Semgrep, Bandit, ...), as globs relative to the workspace, one per line or comma-separated. Their findings are fixed alongside Railo's own."
    required: false
    default: ""

outputs:
  violations_found:
    description: "Number of security findings"
  violations_fixed:
    description: "Number of findings fixed (enforce mode only)"
  status:
    description: "Result status: success, warn_mode, no_findings, error"

runs:
  using: "docker"
  image: "docker://ghcr.io/iwebai/railo:v2"
  env:
    RAILO_LICENSE_KEY: ${{ inputs.license_key }}
    GITHUB_TOKEN: ${{ inputs.github_token }}
    INPUT_MODE: ${{ inputs.mode }}
    INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
    INPUT_SARIF: ${{ inputs.sarif }}
    FIXPOINT_MAX_DIFF_LINES: ${{ inputs.max_diff_lines }}
    FIXPOINT_TEST_BEFORE_COMMIT: ${{ inputs.test_before_commit }}
    FIXPOINT_TEST_COMMAND: ${{ inputs.test_command }}

branding:
  icon: "shield"
  color: "purple"
